

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai_search_db
    environment:
      POSTGRES_USER: abzal
      POSTGRES_PASSWORD: abzalpassword
      POSTGRES_DB: ai_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abzal -d ai_search"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend
  backend:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: ai_search_backend
    ports:
      - "8088:8080"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    # Егер Docker ішінде go run қолданғың келсе:
    command: ["./main"]

  # Python AI Service
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: ai_search_ai
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../ai-service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data: